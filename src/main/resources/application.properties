# APPLICATION
spring.application.name=GOATSPORTS-STORAGE-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# JWT
app.jwt.secret=${JWT_SECRET}
# CLOUDFLARE R2
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT}
cloudflare.r2.public-domain=${CLOUDFLARE_R2_PUBLIC_DOMAIN}
cloudflare.r2.expiration-minutes=${CLOUDFLARE_R2_EXPIRATION_MINUTES}
cloudflare.r2.bucket=${CLOUDFLARE_R2_BUCKET}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=iuh.fit.storageservice.infrastructure.external.kafka.event.FileMoveEvent
spring.kafka.topic.file-move=${KAFKA_TOPIC_FILE_MOVE}
spring.kafka.topic.file-move-completed=${KAFKA_TOPIC_FILE_MOVE_COMPLETED}
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# SWAGGER
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
# FILE UPLOAD
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-part-count=50
# JSON FORMAT
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh